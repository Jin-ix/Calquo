<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Force Update - CALICO v1.0.5</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .version {
      color: #667eea;
      font-size: 14px;
      margin-bottom: 30px;
      font-weight: 600;
    }
    
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }
    
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    
    .loader.active {
      display: block;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .steps {
      text-align: left;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    
    .steps h3 {
      color: #333;
      font-size: 16px;
      margin-bottom: 15px;
    }
    
    .steps ol {
      margin-left: 20px;
      color: #666;
      line-height: 2;
    }
    
    .steps li {
      margin-bottom: 5px;
    }
    
    .emoji {
      font-size: 48px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🔄</div>
    <h1>Force Update CALICO</h1>
    <div class="version">Version 1.0.5</div>
    
    <p>
      Not seeing the latest changes? Click the button below to clear all caches and force a fresh update.
    </p>
    
    <button class="btn" id="clearBtn" onclick="forceClearCache()">
      🧹 Clear Cache & Update
    </button>
    
    <div class="loader" id="loader"></div>
    <div class="status" id="status"></div>
    
    <div class="steps">
      <h3>📱 Manual Steps (if button doesn't work):</h3>
      <ol>
        <li><strong>Windows/Linux:</strong> Press Ctrl + Shift + R</li>
        <li><strong>Mac:</strong> Press Cmd + Shift + R</li>
        <li>Or clear browser cache from settings</li>
      </ol>
    </div>
  </div>

  <script src="/clear-cache.js"></script>
  <script>
    async function forceClearCache() {
      const btn = document.getElementById('clearBtn');
      const loader = document.getElementById('loader');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      loader.classList.add('active');
      status.className = 'status info';
      status.textContent = '🔄 Clearing cache...';
      
      try {
        // Wait a bit to show loading state
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Unregister service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
          }
        }
        
        // Clear caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (const cacheName of cacheNames) {
            await caches.delete(cacheName);
          }
        }
        
        // Success
        loader.classList.remove('active');
        status.className = 'status success';
        status.textContent = '✅ Cache cleared! Redirecting to home page...';
        
        // Redirect to home
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
        
      } catch (error) {
        console.error('Error:', error);
        loader.classList.remove('active');
        status.className = 'status error';
        status.textContent = '❌ Error: ' + error.message + '. Try manual steps below.';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
